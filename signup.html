
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CardioAI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1222;
            color: white;
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 420px;
            background: #151f35;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        h1 {
            color: #35baff;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aab8d0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #34445f;
            border-radius: 8px;
            background: #0b1222;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #159ee8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #087fc2;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #b8c4d8;
        }

        a {
            color: #35baff;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #ff7777;
        }
    </style>
</head>

<body>

    <div class="signup-box">
        <h1>❤️ CardioAI</h1>
        <p class="subtitle">Create Your Account</p>

        <form id="signupForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>

            <p id="message"></p>
        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>

    <script src="/auth.js"></script>

</body>
</html>
